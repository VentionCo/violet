name: Build
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
    - name: submodules
      run: git submodule update --init --recursive
    - name: cmake
      run: cmake -B build -DWARNINGS_AS_ERRORS=1
    - name: make
      run: (cd build; make)

